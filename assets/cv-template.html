<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{FULL_NAME}} — {{TARGET_ROLE}}</title>
  <style>
    @page { size: A4; margin: 12mm 14mm; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 9.5pt;
      line-height: 1.3;
    }
    header { text-align: center; margin-bottom: 8pt; }
    h1 { margin: 0 0 2pt; font-size: 18pt; line-height: 1.1; }
    .target { margin: 0 0 3pt; font-size: 10.5pt; font-weight: 700; }
    .contact { margin: 0; font-size: 8.8pt; }
    a { color: inherit; text-decoration: underline; }
    h2 {
      margin: 8pt 0 3pt;
      padding-bottom: 1pt;
      border-bottom: 0.7pt solid #222;
      font-size: 10pt;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    p { margin: 0 0 3pt; }
    .employer { margin-top: 5pt; font-weight: 700; }
    .role-row {
      display: flex;
      justify-content: space-between;
      gap: 12pt;
      margin-top: 3pt;
      font-weight: 700;
    }
    .role-row span:last-child { white-space: nowrap; }
    ul { margin: 2pt 0 0; padding-left: 14pt; }
    li { margin: 0 0 2pt; }
    .skills p { margin-bottom: 2pt; }
    .label { font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <h1>{{FULL_NAME}}</h1>
    <p class="target">{{TARGET_ROLE_AND_VERIFIED_KEYWORDS}}</p>
    <p class="contact">{{SELECTED_CONTACT_DETAILS}}</p>
  </header>

  <section>
    <h2>Summary</h2>
    <p>{{SUMMARY}}</p>
  </section>

  <section>
    <h2>Professional Experience</h2>
    {{EXPERIENCE_BLOCKS}}
  </section>

  <section class="skills">
    <h2>Skills</h2>
    {{VERIFIED_SKILL_GROUPS}}
  </section>

  <section>
    <h2>Education and Credentials</h2>
    {{EDUCATION_CERTIFICATIONS_LANGUAGES}}
  </section>
</body>
</html>
